# Likho in production (deploy.sh runs it on the server; see README.md).
#
# Nothing listens on a public port: the API is on 127.0.0.1:${LIKHO_PORT}
# behind the server's nginx (nginx/likho.conf), and Postgres and Redis are
# only on this project's own network. Every service has a memory and CPU cap,
# restarts by itself, keeps at most 30 MB of logs, and cannot gain
# privileges.
name: likho

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: likho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: likho
    # tuned for a small share of the machine (see the memory cap below)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [likho]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U likho -d likho"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    shm_size: 128mb
    <<: *logs

  # a cache only (signed-in /me, rate limits, idempotency): no disk, the
  # oldest keys go when it is full; a password even on the private network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru",
              "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--rename-command", "CONFIG", "", "--rename-command", "DEBUG", ""]
    user: redis
    read_only: true
    tmpfs: [/data]
    cap_drop: [ALL]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks: [likho]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    <<: *logs

  api:
    build: ../backend
    image: likho-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://likho:${POSTGRES_PASSWORD}@postgres:5432/likho?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_MAX_CONNS: "16"
      MEDIA_DIR: /media
      ADMIN_DIR: /admin
      GEOIP_DB: /geoip/country.mmdb # families' countries in the admin panel
      # nginx reaches the API through this network's gateway (Docker's port
      # proxy): only it may say who the client is (X-Forwarded-For)
      TRUSTED_PROXIES: 172.30.42.1
      GOMEMLIMIT: 300MiB # the Go heap stays well under the cap
    volumes:
      - ${LIKHO_DIR:-/srv/likho}/media:/media:ro # pictures and recordings (deploy.sh copies them)
      - ${LIKHO_DIR:-/srv/likho}/admin:/admin:ro # the admin panel's build
      - ${LIKHO_DIR:-/srv/likho}/geoip:/geoip:ro
      # the Google Play service account key (server-setup.sh installs it,
      # readable by the API's user only)
      - ${LIKHO_DIR:-/srv/likho}/secrets:/run/secrets/likho:ro
    ports: ["127.0.0.1:${LIKHO_PORT:-8080}:8080"]
    read_only: true
    cap_drop: [ALL]
    networks: [likho]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/likho-api", "health"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M } # the 1-CPU plan has no more (Docker refuses > 1)
    <<: *logs

volumes:
  pgdata:

networks:
  likho:
    ipam:
      config: [{ subnet: 172.30.42.0/24, gateway: 172.30.42.1 }]
