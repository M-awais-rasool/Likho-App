# Port 80 for Likho's names: Let's Encrypt's checks, everything else to HTTPS.
# deploy.sh fills in the domains and installs it as
# /etc/nginx/sites-enabled/likho-http.

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__ __SITE_DOMAIN__ www.__SITE_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
