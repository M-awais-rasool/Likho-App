# TLS and connection settings for each of Likho's HTTPS servers.
# deploy.sh installs it as /etc/nginx/snippets/likho-tls.conf.

ssl_certificate     /etc/letsencrypt/live/likho/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/likho/privkey.pem;

# Mozilla "intermediate": every phone from Android 7 / iOS 10 on
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:likho_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;            # no nginx version in headers or error pages

# slow clients (slowloris) are cut off early
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 20s;
keepalive_timeout 30s;
client_max_body_size 1m;
