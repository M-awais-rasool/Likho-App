# The API over HTTPS (api.<domain>). server-setup.sh fills in the domain
# and installs it as /etc/nginx/sites-enabled/likho once the certificate
# exists (/etc/letsencrypt/live/likho, renewed by certbot by itself). The
# website, when the server serves it too, is likho-site.conf.

upstream likho_api {
    server 127.0.0.1:8080;   # the API container, never public
    keepalive 32;            # reuse connections to the API
}

# ------------------------------------------------------------------ API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    include /etc/nginx/snippets/likho-tls.conf;

    include /etc/nginx/snippets/likho-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_conn likho_conn 40;

    # the admin panel is never on the internet: deploy/admin-tunnel.sh
    location ^~ /admin {
        return 404;
    }

    # readiness tells about the database: only for the machine itself
    location = /readyz {
        return 404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Pictures and recordings straight from the disk (sendfile, no Go in
    # between). The app asks for /media/<path>?v=<hash>: a URL with the
    # hash never changes, so phones keep it for a year.
    location ^~ /media/ {
        limit_req zone=likho_media burst=200 nodelay;
        alias /srv/likho/media/;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=2000 inactive=10m;
        open_file_cache_valid 60s;
        include /etc/nginx/snippets/likho-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            audio/mp4 m4a;
            image/png png;
            application/octet-stream lip;
        }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    # signing in: few tries per IP (the API limits it again per IP)
    location ^~ /v1/auth/ {
        limit_req zone=likho_auth burst=10 nodelay;
        proxy_pass http://likho_api;
        include /etc/nginx/snippets/likho-proxy.conf;
    }

    # everything else: the API (it gzips the course and the media manifest
    # itself and answers 304 for unchanged ones)
    location / {
        limit_req zone=likho_api burst=40 nodelay;
        proxy_pass http://likho_api;
        include /etc/nginx/snippets/likho-proxy.conf;
    }
}
