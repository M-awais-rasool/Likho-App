# nginx site for the Likho API on a shared server:
#   sudo cp deploy/nginx/likho.conf /etc/nginx/sites-available/likho.conf
#   sudo ln -s ../sites-available/likho.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.likho.app      # HTTPS (adds the certificate lines)
#   sudo nginx -t && sudo systemctl reload nginx
# Change api.likho.app, the port (LIKHO_PORT) and /srv/likho (LIKHO_DIR) if
# yours differ.

upstream likho_api {
    server 127.0.0.1:8080;
    keepalive 32;   # reuse connections to the API
}

server {
    listen 80;
    server_name api.likho.app;

    client_max_body_size 1m;

    # Pictures and recordings straight from the disk (sendfile, no Go in
    # between). The app asks for /media/<path>?v=<hash>: a URL with the
    # hash never changes, so phones and any CDN keep it for a year.
    location /media/ {
        alias /srv/likho/media/;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=2000 inactive=10m;
        open_file_cache_valid 60s;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        types {
            audio/mp4 m4a;
            image/png png;
            application/octet-stream lip;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Everything else: the API (it gzips the course and the media manifest
    # itself and answers 304 for unchanged ones).
    location / {
        proxy_pass http://likho_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
