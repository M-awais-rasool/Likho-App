# Security headers for every HTTPS answer. Included in each location that
# adds its own headers (nginx drops the server's add_header lines there).
# deploy.sh installs it as /etc/nginx/snippets/likho-headers.conf.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
