# The website (<domain>, www.<domain>) over HTTPS, only when the server
# serves it (SITE_DOMAIN set; otherwise it lives elsewhere, e.g. Vercel).
# server-setup.sh fills in the domain and installs it as
# /etc/nginx/sites-enabled/likho-site.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__SITE_DOMAIN__;

    include /etc/nginx/snippets/likho-tls.conf;
    include /etc/nginx/snippets/likho-headers.conf;

    return 301 https://__SITE_DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SITE_DOMAIN__;

    include /etc/nginx/snippets/likho-tls.conf;

    # the static export of landing/ (deploy.sh builds and copies it)
    root /srv/likho/site;
    index index.html;
    error_page 404 /404.html;
    limit_conn likho_conn 40;
    limit_req zone=likho_site burst=100 nodelay;

    include /etc/nginx/snippets/likho-headers.conf;
    # Next.js writes small inline scripts and styles into every page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/likho-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
    }
}
