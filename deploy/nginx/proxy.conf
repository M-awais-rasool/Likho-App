# How nginx forwards to the API. deploy.sh installs it as
# /etc/nginx/snippets/likho-proxy.conf.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# the client's real IP, replacing (not adding to) anything the client sent;
# the API only believes these headers from nginx (TRUSTED_PROXIES)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
