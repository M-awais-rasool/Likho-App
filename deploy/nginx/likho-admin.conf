# The admin panel over HTTPS (admin.<domain>), with ADMIN_DOMAIN only.
# server-setup.sh fills in the domain and installs it as
# /etc/nginx/sites-enabled/likho-admin. Only the panel, its API and the
# media its phone preview plays; everything else is 404. Signing in needs
# the password and the code of an authenticator app; the API locks an
# account after 5 wrong tries, whatever the IP.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ADMIN_DOMAIN__;

    include /etc/nginx/snippets/likho-tls.conf;

    # likho-headers.conf, but the panel frames its own phone preview
    # (SAMEORIGIN, not DENY) and gets a content security policy: scripts
    # only from here (the preview's Flutter engine is WebAssembly), Google
    # Fonts for the panel and the preview's text
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_conn likho_conn 40;

    location = / {
        return 302 /admin/;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # signing in: a few tries per IP (the API limits it per IP and per
    # account again)
    location ^~ /admin/api/v1/auth/ {
        limit_req zone=likho_admin_auth burst=5 nodelay;
        proxy_pass http://likho_api;
        include /etc/nginx/snippets/likho-proxy.conf;
    }

    # the panel's page and API
    location ^~ /admin {
        limit_req zone=likho_api burst=60 nodelay;
        proxy_pass http://likho_api;
        include /etc/nginx/snippets/likho-proxy.conf;
    }

    # what the phone preview plays (the app's public media, as on the API)
    location = /v1/media {
        limit_req zone=likho_api burst=40 nodelay;
        proxy_pass http://likho_api;
        include /etc/nginx/snippets/likho-proxy.conf;
    }

    location ^~ /media/ {
        limit_req zone=likho_media burst=200 nodelay;
        root /srv/likho;
        sendfile on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            audio/mp4 m4a;
            image/png png;
            application/octet-stream lip;
        }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
