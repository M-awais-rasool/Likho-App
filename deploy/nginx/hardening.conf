# Server-wide nginx settings for Likho (http context): the per-IP limits.
# deploy.sh installs it as /etc/nginx/conf.d/likho-hardening.conf. TLS and
# timeouts are per server (tls.conf): Ubuntu's nginx.conf already sets some
# of them at this level, and nginx refuses a directive set twice.

# per-IP limits (anti-scraping and anti-flood); 429 when exceeded.
# fail2ban bans IPs that keep hitting them (jail nginx-limit-req).
limit_req_zone $binary_remote_addr zone=likho_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=likho_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=likho_media:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=likho_site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=likho_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
