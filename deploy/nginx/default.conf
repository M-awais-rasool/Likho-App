# Anything that does not ask for one of Likho's names (bots scanning the
# server's IP): plain HTTP gets the connection closed, HTTPS gets no
# certificate at all, so the IP reveals nothing.
# deploy.sh installs it as /etc/nginx/sites-enabled/00-default.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
