name: likho
description: "Likho: English handwriting for kids aged 5-8."
publish_to: 'none'
version: 0.2.0+12

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  forge2d: ^0.14.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  just_audio: ^0.10.6
  material_symbols_icons: ^4.2960.0
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  web: ^1.1.1 # admin level preview (lib/preview)
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/mascot/accessories/
    - assets/mascot/fx/
    - assets/audio/
    - assets/voice/
    - assets/stories/a/
    - assets/games/
    - assets/games/monsters/
    - assets/games/words/
    - assets/games/runner/
    - assets/games/smash/
    - assets/games/slice/
    - assets/sfx/
    - assets/licenses/
    # dev-only reference images for the overlay check (remove from release builds)
    - assets/reference/
    - assets/reference/screens/
