name: Admin

on:
  push:
    branches: [master]
    paths: ["admin/**", ".github/workflows/admin.yml"]
  pull_request:
    paths: ["admin/**", ".github/workflows/admin.yml"]

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
